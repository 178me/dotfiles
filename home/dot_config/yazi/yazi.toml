[mgr]
ratio          = [ 1, 4, 3 ]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5

[preview]
tab_size        = 2
max_width       = 600
max_height      = 900
cache_dir       = ""
image_filter    = "triangle"
image_quality   = 75
sixel_fraction  = 15
ueberzug_scale  = 0.5
ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
open = [
	{ run = "xdg-open %s",               desc = "Open", for = "linux", orphan = true },
]
edit = [
	{ run = "${EDITOR:-vi} %s",          desc = "$EDITOR", for = "linux", block = true },
]
nvim = [
	{ run = "nvim %s",                   desc = "Neovim", for = "linux", block = true },
]
reveal = [
	{ run = 'xdg-open "$(dirname %s1)"', desc = "Reveal", for = "linux", orphan = true },
]
play = [
	{ run = "xdg-open %s",               desc = "Play", for = "linux", orphan = true },
]
extract = [
	{ run = "ya pub extract --list %s",  desc = "Extract", for = "linux" },
]
preview = [
	{ run = "gwenview %s",               desc = "Image preview", for = "linux", orphan = true },
]

[open]
rules = [
	# Folder
	{ url = "*/", use = [ "edit", "open", "reveal" ] },
	# Text
	{ mime = "text/*", use = [ "edit", "nvim", "reveal" ] },
	# Image
	{ mime = "image/*", use = [ "preview", "open", "reveal" ] },
	# Media
	{ mime = "{audio,video}/*", use = [ "play", "reveal" ] },
	# Excel
	{ mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet", use = [ "open", "reveal" ] },
	{ mime = "application/vnd.ms-excel", use = [ "open", "reveal" ] },
	{ url = "*.xlsx", use = [ "open", "reveal" ] },
	{ url = "*.xls", use = [ "open", "reveal" ] },
	{ url = "*.xlsm", use = [ "open", "reveal" ] },
	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal" ] },
	# JSON
	{ mime = "application/{json,ndjson}", use = [ "edit", "reveal" ] },
	{ mime = "*/javascript", use = [ "edit", "reveal" ] },
	# Empty file
	{ mime = "inode/empty", use = [ "edit", "reveal" ] },
	# Fallback
	{ url = "*", use = [ "open", "reveal" ] },
]
