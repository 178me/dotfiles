customCommands:
  images:
    - name: tag image
      attach: true
      command: '$HOME/.config/lazydocker/scripts/tag-image.sh "{{ .Image.ID }}" "{{ .Image.Name }}" "{{ .Image.Tag }}"'
    - name: push image (choose tag)
      attach: true
      command: '$HOME/.config/lazydocker/scripts/push-image.sh "{{ .Image.ID }}"'
